
apiVersion: redis.kun/v1alpha1
kind: RedisClusterBackup
metadata:
  name: example-redisclusterbackup
  annotations:
    redis.kun/scope: cluster-scoped
spec:
  image: docker.io/sasidharan/redisclusterutil:v6
  redisClusterName: example-distributedrediscluster
  utilConfig: "test-config"
  startupCommand: "/usr/local/bin/redisUtil"
  imagePullPolicy: "Never"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
data:
  backupschedule.yaml: |
    backupEnabled: true
    logEnabled: false
    backupInterval: 3m
    s3retry: 6
    backupretry: 6
    logInterval: 30
    termCheckIteration: -1
    termCheckInterval: 5
  

