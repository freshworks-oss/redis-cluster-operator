
apiVersion: redis.kun/v1alpha1
kind: RedisClusterBackup
metadata:
  name: example-redisclusterbackup
  annotations:
    redis.kun/scope: cluster-scoped
spec:
  redisClusterName: example-distributedrediscluster
  utilSpec:
    image: docker.io/sasidharan/redisclusterutil:v11
    startupCommand: "/usr/local/bin/redisUtil"
    s3Bucket: "test"
    utilConfig:  "test-config"
    imagePullPolicy: "Never"
    replicas: 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
data:
  backupschedule.yaml: |
    backupEnabled: true
    logEnabled: false
    backupInterval: 3m
    s3retry: 6
    backupretry: 6
    logInterval: 30
    termCheckIteration: -1
    termCheckInterval: 5
  

