apiVersion: v1
kind: Secret
metadata:
  annotations:
    # if your operator run as cluster-scoped, add this annotations
    redis.kun/scope: cluster-scoped
  name: dbaas-redis--dbaas-redis--test-cluster--pinger
type: Opaque
stringData:
  acl: ~opqrstuvwredability &* -@all +ping +info +incr
  password: pingpass
  username: pinger
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: util-config
data:
  backupschedule.yaml: |
    backupEnabled: true
    logEnabled: true
    backupInterval: 59m
    logInterval: 1
    s3retry: 6
    backupretry: 6
    termCheckIteration: -1
    termCheckInterval: 5
    compressEnabled: true
    compressLevel: -1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: liveness-data
data:
  liveness.sh: |
    #!/bin/sh
    redis-cli -h $HOSTNAME --user pinger --pass pingpass --no-auth-warning ping | grep -q PONG
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: readiness-data
data:
  readiness.sh: |
    #!/bin/sh
    redis-cli -h $HOSTNAME --user pinger --pass pingpass --no-auth-warning ping | grep -q PONG
---
apiVersion: redis.kun/v1alpha1
kind: DistributedRedisCluster
metadata:
  annotations:
    # if your operator run as cluster-scoped, add this annotations
    redis.kun/scope: cluster-scoped
  name: distributedrediscluster-test-cluster-1
spec:
  additionalUsers:
  - name: dbaas-redis--test-cluster--test-cluster-1--dinesh
  - name: dbaas-redis--dbaas-redis--test-cluster--pinger
  adminUser:
    name: dbaas-redis--test-cluster--test-cluster-1--admin
  annotations:
    prometheus.io/path: /metrics
    prometheus.io/port: "9100"
    prometheus.io/scrape: "true"
  clusterReplicas: 1
  config:
    activerehashing: "yes"
    appendonly: "no"
    maxmemory: "734003200"
    maxmemory-policy: noeviction
    maxmemory-samples: "30"
    notify-keyspace-events: ""
  defaultUser:
    name: dbaas-redis--test-cluster--test-cluster-1--default
  utilConfig: "util-config"
  image: 582763096612.dkr.ecr.us-east-1.amazonaws.com/dbaas-redis/redis:6.2.13-alpine
  initContainers:
  - name: initialize
    image: sasidharangopal463/restoreclusterutil:v2
    imagePullPolicy: Always
    command:
    - "/usr/local/bin/restoreclusterutil"
    env:
    - name: "CLUSTER_NAME"
      value: "distributedrediscluster-test-cluster-1"
    - name: "S3_BUCKET"
      value: "redis-logs-bucket-staging-us-east-1"
    volumeMounts:
    - mountPath: /config
      name: utilconf
    - mountPath: /data
      name: redis-data
  masterSize: 3
  terminationGracePeriod: 100
  customLivenessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - /liveprobe/liveness.sh
    failureThreshold: 60
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
  readinessProbe:
    exec:
      command:
      - /bin/sh
      - -c
      - /readyprobe/readiness.sh
    failureThreshold: 3
    initialDelaySeconds: 30
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5
