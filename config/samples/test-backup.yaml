
apiVersion: redis.kun/v1alpha1
kind: RedisClusterBackup
metadata:
  name: example-redisclusterbackup
  annotations:
    redis.kun/scope: cluster-scoped
spec:
  image: nginx:latest
  redisClusterName: example-distributedrediscluster
  utilConfig: "test-config"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: test-config
data:
  backupschedule.yaml: |
    backupEnabled: true
    logEnabled: true
    backupInterval: 59
    s3retry: 6
    backupretry: 6
    logInterval: 30
    initretry: 50
    backupDir: /data
    dbfilename: dump.rdb
    termCheckIteration: -1
    termCheckInterval: 5
  

